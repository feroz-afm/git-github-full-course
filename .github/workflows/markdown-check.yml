name: Markdown links

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every linked local file exists
        run: |
          status=0
          for f in $(find . -name "*.md" -not -path "./.git/*"); do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\([^)#:]+\.(md|pdf|yml|sh)\)' "$f" | sed -E 's/^\]\((.*)\)$/\1/'); do
              if [ ! -e "$dir/$link" ]; then echo "Broken link in $f -> $link"; status=1; fi
            done
          done
          exit $status
